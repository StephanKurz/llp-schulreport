<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MENTOR Leselern-Paten Reutlingen e.V.</title>
<style>
  :root { --brand: #bd0010; }
  body{font-family:Helvetica,Arial,sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#000;}
  img.header{max-width:100%;display:block;margin-bottom:24px;}
  h1{color:#000;font-size:20px;}
  p{font-size:11pt;line-height:1.5;}
  .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  button{border:none;border-radius:4px;padding:10px 22px;font-size:11pt;font-weight:bold;cursor:pointer;}
  button.primary{background:var(--brand);color:#fff;}
  button.secondary{background:#fff;color:var(--brand);border:2px solid var(--brand);}
</style>
</head>
<body>
<img class="header" src="https://www.leselern-paten.org/files/E-Mail-Signatur_V1_4.png" alt="MENTOR Leselern-Paten Reutlingen e.V.">
<div id="content">Lädt ...</div>
<script>
/*
 * Generische Informations-/Bestätigungsseite im Corporate Design von MENTOR - Leselern-Paten
 * Reutlingen e.V. (Vereinsfarbe #bd0010, Kopfgrafik) - projektübergreifend wiederverwendbar,
 * nicht an ein einzelnes Projekt gebunden.
 *
 * Aufruf: page.html?heading=...&text=...
 *   &buttonLabel=...&postTo=<vollständige, bereits urlencodete Ziel-URL inkl. eigener Query-Parameter>
 *   &secondaryButtonLabel=...&secondaryText=<wird nach Klick angezeigt, KEIN Request>
 *
 * `heading`/`text`/`secondaryText` werden ausschließlich als reiner Text eingefügt
 * (textContent, kein innerHTML) - sicher gegenüber HTML-/Script-Injection über die
 * URL-Parameter, auch wenn der Link öffentlich (z.B. per E-Mail) verschickt wird.
 *
 * Der Haupt-Button (primary) löst per POST an `postTo` eine echte Aktion aus. Der optionale
 * zweite Button (secondary) löst KEINE Aktion/Netzwerk-Request aus - er zeigt nur
 * `secondaryText` an (z.B. für einen "Doch, gerne"-Abbrechen-Fall, bei dem sich am
 * Ausgangszustand nichts ändern muss).
 */
function param(name) {
  return new URLSearchParams(window.location.search).get(name);
}

var heading = param("heading") || "MENTOR - Leselern-Paten Reutlingen e.V.";
var text = param("text") || "";
var buttonLabel = param("buttonLabel");
var postTo = param("postTo");
var secondaryButtonLabel = param("secondaryButtonLabel");
var secondaryText = param("secondaryText") || "Alles klar, keine Änderung vorgenommen.";

var content = document.getElementById("content");
content.innerHTML = "";

var h1 = document.createElement("h1");
h1.textContent = heading;
content.appendChild(h1);

if (text) {
  var p = document.createElement("p");
  p.textContent = text;
  content.appendChild(p);
}

if ((buttonLabel && postTo) || secondaryButtonLabel) {
  var buttonRow = document.createElement("div");
  buttonRow.className = "buttons";

  if (buttonLabel && postTo) {
    var form = document.createElement("form");
    form.method = "POST";
    form.action = postTo;
    var primaryButton = document.createElement("button");
    primaryButton.type = "submit";
    primaryButton.className = "primary";
    primaryButton.textContent = buttonLabel;
    form.appendChild(primaryButton);
    buttonRow.appendChild(form);
  }

  if (secondaryButtonLabel) {
    var secondaryButton = document.createElement("button");
    secondaryButton.type = "button";
    secondaryButton.className = "secondary";
    secondaryButton.textContent = secondaryButtonLabel;
    secondaryButton.addEventListener("click", function () {
      content.innerHTML = "";
      var doneP = document.createElement("p");
      doneP.textContent = secondaryText;
      content.appendChild(doneP);
    });
    buttonRow.appendChild(secondaryButton);
  }

  content.appendChild(buttonRow);
}
</script>
</body>
</html>
