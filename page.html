<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MENTOR Leselern-Paten Reutlingen e.V.</title>
<style>
  :root { --brand: #bd0010; }
  body{font-family:Helvetica,Arial,sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#000;}
  img.header{max-width:100%;display:block;margin-bottom:24px;}
  h1{color:#000;font-size:20px;}
  p{font-size:11pt;line-height:1.5;}
  .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  button{border:none;border-radius:4px;padding:10px 22px;font-size:11pt;font-weight:bold;cursor:pointer;}
  button.primary{background:var(--brand);color:#fff;}
  button.secondary{background:#fff;color:var(--brand);border:2px solid var(--brand);}
</style>
</head>
<body>
<img class="header" src="https://www.leselern-paten.org/files/E-Mail-Signatur_V1_4.png" alt="MENTOR Leselern-Paten Reutlingen e.V.">
<div id="content">Lädt ...</div>
<script>
/*
 * Generische Informations-/Bestätigungsseite im Corporate Design von MENTOR - Leselern-Paten
 * Reutlingen e.V. (Vereinsfarbe #bd0010, Kopfgrafik) - projektübergreifend wiederverwendbar,
 * nicht an ein einzelnes Projekt gebunden. Unterstützt eine beliebige Anzahl Buttons (nicht
 * nur zwei) über einen JSON-kodierten `buttons`-Parameter.
 *
 * Aufruf: page.html?heading=...&text=...&buttons=<urlencodetes JSON-Array>
 *
 * Jedes Element von `buttons`: {"label": "...", "postTo": "..."} löst per POST (leerer
 * Body) eine echte Aktion an `postTo` aus - die Server-Antwort (z.B. einer Edge Function)
 * wird direkt angezeigt. {"label": "...", "resultText": "..."} löst KEINEN Request aus,
 * sondern zeigt nur `resultText` clientseitig an (z.B. für einen Abbrechen-/"Doch,
 * gerne"-Fall ohne Änderung am Ausgangszustand). Optional "style": "primary" (Vereinsfarbe
 * gefüllt) - ohne Angabe ist ein Button "secondary" (Vereinsfarbe umrandet).
 *
 * `heading`/`text`/`resultText` werden ausschließlich als reiner Text eingefügt
 * (textContent, kein innerHTML) - sicher gegenüber HTML-/Script-Injection über die
 * URL-Parameter, auch wenn der Link öffentlich (z.B. per E-Mail) verschickt wird.
 */
function param(name) {
  return new URLSearchParams(window.location.search).get(name);
}

var heading = param("heading") || "MENTOR - Leselern-Paten Reutlingen e.V.";
var text = param("text") || "";
var buttons = [];
var buttonsParam = param("buttons");
if (buttonsParam) {
  try {
    buttons = JSON.parse(buttonsParam);
    if (!Array.isArray(buttons)) buttons = [];
  } catch (e) {
    buttons = [];
  }
}

var content = document.getElementById("content");
content.innerHTML = "";

var h1 = document.createElement("h1");
h1.textContent = heading;
content.appendChild(h1);

if (text) {
  var p = document.createElement("p");
  p.textContent = text;
  content.appendChild(p);
}

if (buttons.length > 0) {
  var buttonRow = document.createElement("div");
  buttonRow.className = "buttons";

  buttons.forEach(function (btn) {
    if (!btn || !btn.label) return;
    var styleClass = btn.style === "primary" ? "primary" : "secondary";

    if (btn.postTo) {
      var form = document.createElement("form");
      form.method = "POST";
      form.action = btn.postTo;
      var submitButton = document.createElement("button");
      submitButton.type = "submit";
      submitButton.className = styleClass;
      submitButton.textContent = btn.label;
      form.appendChild(submitButton);
      buttonRow.appendChild(form);
    } else {
      var actionButton = document.createElement("button");
      actionButton.type = "button";
      actionButton.className = styleClass;
      actionButton.textContent = btn.label;
      actionButton.addEventListener("click", function () {
        content.innerHTML = "";
        var doneP = document.createElement("p");
        doneP.textContent = btn.resultText || "Alles klar, keine Änderung vorgenommen.";
        content.appendChild(doneP);
      });
      buttonRow.appendChild(actionButton);
    }
  });

  content.appendChild(buttonRow);
}
</script>
</body>
</html>
